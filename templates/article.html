<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} | Aswini Lakshminarayanan</title>
  <meta name="description" content="{{excerpt}}" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{excerpt}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="../index.html" class="brand">Aswini <span>Lakshminarayanan</span></a>
      <ul class="nav-links">
        <li><a href="../index.html#about">About</a></li>
        <li><a href="../index.html#experience">Experience</a></li>
        <li><a href="index.html">Writing</a></li>
        <li class="nav-cta"><a class="btn btn-primary" href="../index.html#contact">Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="article container">
    <div class="article-wrap">
      <a class="back-link" href="index.html">← All articles</a>
      <p class="article-meta">{{dateLabel}} · {{readingTime}} min read</p>
      <h1>{{title}}</h1>
      <div class="article-tags">{{tagsHTML}}</div>
      <article class="prose">
        {{content}}
      </article>
      <div class="article-foot">
        <a class="back-link" href="index.html">← All articles</a>
        <a class="btn btn-ghost" href="{{shareUrl}}" target="_blank" rel="noopener">Share on LinkedIn</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container row">
      <div>© <span id="year"></span> Aswini Lakshminarayanan.</div>
      <div class="social"><a href="../index.html">Home</a><a href="index.html">Writing</a></div>
    </div>
  </footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
